<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Controle Geral MPT – Actemium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fa;--surface:#ffffff;--surface2:#f8fafc;--line:#e2e8f0;--line2:#cbd5e1;
  --text:#0f1b2d;--muted:#5b6b80;--faint:#94a3b8;
  --navy:#14306b;--pri:#0b5cad;--pri2:#0a4d91;--priSoft:#e7f0fb;--lime:#b5c900;
  --in:#0f8a5f;--inSoft:#e5f5ee;--out:#c2570c;--outSoft:#fdf0e6;--warn:#b7791f;--warnSoft:#fdf6e3;
  --red:#c42b2b;--redSoft:#fdecec;--violet:#6941c6;--violetSoft:#f1ecfb;
  --r:14px;--sh:0 1px 2px rgba(15,27,45,.05),0 4px 14px rgba(15,27,45,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
a{color:var(--pri)}
.shell{display:flex;min-height:100vh}
.side{width:244px;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px;flex:none;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand img{max-height:30px;max-width:120px;object-fit:contain}
.wordmark{font-weight:800;letter-spacing:.06em;color:var(--navy);font-size:17px}
.brand small{display:block;color:var(--muted);font-size:11.5px;font-weight:500;letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.navm .grp{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;cursor:pointer;font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.08em;text-align:left}.navm .grp .chev{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}.navm .grp.fe .chev{transform:rotate(-90deg)}.navm .grp.ativo span::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#b5c900;margin-left:7px;vertical-align:middle}.navm .grpb.fe{display:none}
.nav .grp{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;border-radius:8px;cursor:pointer;font:inherit;font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;padding:10px 12px 6px;margin-top:2px;text-align:left}
.nav .grp .chev{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s;flex:none}.nav .grp.fe .chev{transform:rotate(-90deg)}.nav .grp.ativo span::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#b5c900;margin-left:7px;vertical-align:middle}
.nav .grpb.fe{display:none}
.navm .grp{color:#14306b!important;opacity:1!important;font-size:11px;padding:12px 6px 6px;border-top:1px solid var(--line);border-radius:0}.navm .grp:first-child{border-top:0}.navm .grp.ativo{color:#0b5cad!important}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{background:var(--surface2);color:var(--text)}
.nav button.on{background:var(--priSoft);color:var(--pri);font-weight:600}
.nav button .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
.side .me{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--priSoft);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me .nm{font-weight:600;font-size:13px;line-height:1.2}.me .rl{font-size:11.5px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:none}
.content{padding:24px 28px 40px;max-width:1340px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph .tag{display:inline-block;font-size:11px;font-weight:700;color:var(--navy);background:#eef2fb;border-radius:6px;padding:2px 8px;margin-bottom:6px;letter-spacing:.04em}
.bnav{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:600}
.card h3 small{color:var(--muted);font-weight:500;margin-left:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface2)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.p:hover{background:var(--pri2)}
.btn.n{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.o{background:var(--out);border-color:var(--out);color:#fff}
.btn.g{background:var(--in);border-color:var(--in);color:#fff}
.btn.v{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.d{color:var(--red);border-color:#f1c4c4}.btn.d:hover{background:var(--redSoft)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.f label .req{color:var(--red)}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:10px 12px;outline:none;transition:border .15s,box-shadow .15s}
.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(11,92,173,.13)}
textarea.in{min-height:76px;resize:vertical}
.sec{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.07em;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec:before{content:"";width:4px;height:14px;border-radius:2px;background:var(--lime)}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.sec:first-child{margin-top:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:#eef1f5;color:#475569}
.chip.adm{background:var(--priSoft);color:var(--pri)}.chip.est{background:var(--inSoft);color:var(--in)}.chip.off{background:var(--redSoft);color:var(--red)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.mono{font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f9fbfe}
.tbl .desc{font-weight:600;max-width:300px}
.tbl .desc small{display:block;color:var(--muted);font-weight:500;margin-top:2px}
.tbl input[type=checkbox]{width:17px;height:17px;accent-color:var(--pri)}
.tw{overflow:auto;border-radius:var(--r)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.hb{display:grid;grid-template-columns:minmax(80px,210px) 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-weight:500}
.hb .tr{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.hb .tr i{display:block;height:100%;border-radius:6px}
.hb b{font-variant-numeric:tabular-nums;font-size:12.5px;min-width:44px;text-align:right}
.hb b em{font-style:normal;color:var(--faint);font-weight:500;margin-left:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
svg.chart text{font-family:Inter,sans-serif;font-size:11px;fill:var(--muted)}
.act{display:flex;gap:12px;padding:11px 8px;margin:0 -8px;border-radius:10px;align-items:flex-start;cursor:pointer}
.act:hover{background:var(--surface2)}
.act .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.act .tx{flex:1;min-width:0}.act .tx b{font-weight:600}
.act .tx div{font-size:12.5px;color:var(--muted);margin-top:2px}
.act time{font-size:12px;color:var(--muted);white-space:nowrap}
.acts{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.ov{position:fixed;inset:0;background:rgba(15,27,45,.42);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;backdrop-filter:blur(2px)}
.md{background:var(--surface);border-radius:18px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(15,27,45,.25);animation:pop .16s ease-out}
.md.lg{max-width:900px}
.md .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.md .mh h2{margin:0;font-size:17px}
.md .mb{padding:18px 20px}
.md .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.dl div small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin-bottom:2px}
.dl div b{font-weight:600;word-break:break-word;white-space:pre-wrap}
.dl .full{grid-column:1/-1}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.photos .ph1{width:92px;height:92px;border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--line);background:var(--surface2)}
.photos .ph1 img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.photos .ph1 button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(15,27,45,.7);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.addph{width:92px;height:92px;border-radius:12px;border:1.5px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;background:var(--surface2);text-align:center}
.addph:hover{border-color:var(--pri);color:var(--pri)}
.files{display:flex;flex-direction:column;gap:8px}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface2)}
.file .fi{width:34px;height:34px;border-radius:8px;background:var(--redSoft);color:var(--red);display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}
.file .fn{flex:1;min-width:0}.file .fn b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file .fn small{color:var(--muted)}
.hist{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;background:var(--surface2)}
.hist .hh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.hist .hd{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.tl{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:12px;margin-left:4px}
.tl div{padding:4px 0}.tl b{color:var(--text);font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:#0f1b2d;color:#fff;padding:11px 16px;border-radius:12px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:90vw;animation:pop .16s}
#toast div.err{background:var(--red)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#eaf1fb 0%,#f6f8fb 55%,#f3f7e6 100%)}
.login .card{width:100%;max-width:400px;padding:30px 28px;border-top:4px solid var(--lime)}
.login .lg{text-align:center;margin-bottom:22px}
.login .lg img{max-height:46px;max-width:200px;object-fit:contain}
.login .lg .wordmark{font-size:26px}
.login h2{margin:14px 0 4px;font-size:19px}
.login p{margin:0;color:var(--muted);font-size:13px}
.login form{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.note{background:var(--priSoft);color:#1d4f86;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.note.w{background:var(--warnSoft);color:#7a5414}
.lbl{width:100%;max-width:340px;margin:0 auto;overflow:hidden;aspect-ratio:80/55;border:1.5px solid #333;border-radius:8px;background:#fff;padding:8px 10px;display:flex;flex-direction:column;font-size:9px;color:#000}
.lbl .lh{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding-bottom:5px}
.lbl .lh img{max-height:22px;max-width:110px;object-fit:contain}
.lbl .lh .t{text-align:right;font-weight:700;font-size:9px}.lbl .lh .t small{display:block;font-weight:400;font-size:7.5px}
.lbl .lb2{display:flex;gap:8px;flex:1;padding-top:5px;min-height:0}
.lbl .lf{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;align-content:start;min-width:0}
.lbl .lf div{min-width:0}
.lbl .lf small{display:block;font-size:6.5px;color:#666;text-transform:uppercase}
.lbl .lf b{display:block;font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl .lf .w{grid-column:1/-1}
.lbl .lq{width:22%;text-align:center;font-weight:700;font-size:9px}
.lbl .lq svg{width:100%;height:auto;display:block}
.sel-bar{position:sticky;bottom:12px;z-index:5;margin-top:12px;background:#0f1b2d;color:#fff;border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 10px 30px rgba(15,27,45,.25)}
.filters{display:grid;grid-template-columns:2fr repeat(4,minmax(0,1fr)) auto;gap:10px;margin-bottom:14px}
.searchw{position:relative}.searchw svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.searchw .in{padding-left:36px}
.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.imgview{max-width:100%;max-height:80vh;display:block;margin:auto;border-radius:12px}
.pill-tabs{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.pill-tabs button{border:0;background:none;padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.pill-tabs button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(15,27,45,.12)}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks button{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 11px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--muted)}
.picks button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.stbtns{display:flex;flex-wrap:wrap;gap:6px}
.stbtns button{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 10px;font-weight:600;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.stbtns button i{width:8px;height:8px;border-radius:50%}
.stbtns button.on{color:#fff}
.sheet .mb button.lnk{display:flex;width:100%;align-items:center;gap:12px;border:0;background:none;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:500;font-size:15px;text-align:left}
.sheet .mb button.lnk:last-child{border-bottom:0}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--pri)}
/* dashboard */
.hero{background:linear-gradient(120deg,#0e2554 0%,#14306b 45%,#0b5cad 100%);color:#fff;border-radius:18px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 10px 30px rgba(20,48,107,.25);position:relative;overflow:hidden;margin-bottom:14px}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(181,201,0,.12)}
.hero:before{content:"";position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--lime)}
.hero h1{margin:4px 0 2px;font-size:24px;font-weight:700}
.hero p{margin:0;opacity:.85}.hero-d{font-size:12px;opacity:.75;text-transform:capitalize;font-weight:500}
.hero-r{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.hero .hb1{background:#fff;color:var(--navy);border-color:#fff}
.hero .hb2{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.dbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dbar .pill-tabs{background:#fff}
.dsel{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}.dsel select.in{width:auto;min-width:150px;padding:8px 12px}
.rng{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi2{padding:14px 14px 12px;position:relative;overflow:hidden;border-top:3px solid var(--c);cursor:pointer;transition:transform .12s}
.kpi2:hover{transform:translateY(-2px)}
.kpi2 .kt{display:flex;align-items:center;gap:8px}
.kpi2 .kic{width:30px;height:30px;border-radius:9px;background:var(--cb);color:var(--c);display:grid;place-items:center;flex:none}
.kpi2 .klb{font-size:12px;color:var(--muted);font-weight:600;line-height:1.25}
.kpi2 .kvl{font-size:26px;font-weight:800;margin-top:10px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi2 .ksb{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg1{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}.dg2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.ch h3{margin:0}
.sttiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stt{border-radius:12px;padding:14px 12px;display:flex;flex-direction:column;gap:4px}
.stt span{font-size:11px;font-weight:700;letter-spacing:.04em}.stt b{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stt em{font-style:normal;font-size:11.5px;opacity:.85}
.rk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted);margin-right:7px}

async function hashPw(pw,salt){
 const enc=new TextEncoder();
 const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},key,256);
 return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function saldoCard(){

 const sumE=a=>a.reduce((s,r)=>s+valorEnt(r),0),sumS=a=>a.reduce((s,r)=>s+valorSai(r),0);
 const rec=E('rec'),fab=E('fab'),mpt=E('mpt'),dev=E('dev'),emb=E('emb'),env=E('env');
 const ent=sumE(rec)+sumE(fab)+sumE(mpt),sai=sumS(dev)+sumS(emb)+sumS(env);const saldo=ent-sai;
 const it=(l,val,n,c,go,neg)=>`<div class="sm1" data-act="kgo" data-v="${go}" data-st="" style="--c:${c}"><span>${neg?'− ':'+ '}${l}</span><b>${brl(val)||'R$ 0,00'}</b><em>${n} registro(s)</em></div>`;
 return `<div class="card saldo"><div class="sl" data-act="go" data-v="rec"><div class="sic">${ic('mpt',22)}</div><div><span>Saldo em estoque MPT</span><b style="${saldo<0?'color:#c42b2b':''}">${brl(saldo)||'R$ 0,00'}</b></div></div>
  <div class="sr">${it('Rec. materiais BR',sumE(rec),rec.length,'#0f8a5f','rec')}${it('Rec. Fabricados',sumE(fab),fab.length,'#0e7490','fab')}${it('OPs em MPT',sumE(mpt),mpt.length,'#14306b','mpt')}${it('Devoluções',sumS(dev),dev.length,'#db2777','dev',1)}${it('Embarques',sumS(emb),emb.length,'#6941c6','emb',1)}${it('Requisições Fábrica',sumS(env),env.length,'#c2570c','env',1)}</div></div>`;
}
function niceMax(v){let st=Math.max(1,Math.ceil(v/4));const p=Math.pow(10,Math.floor(Math.log10(st)));const n=st/p;st=(n<=1?1:n<=2?2:n<=5?5:10)*p;return st*4}
function chartBars(labels,series){
 const sm=window.innerWidth<600;const W=sm?360:640,H=sm?210:240,pl=30,pr=8,pt=14,pb=26,ih=H-pt-pb,iw=W-pl-pr;
 const mx=niceMax(Math.max(1,...series.flatMap(s=>s.v)));const cw=iw/labels.length;const gap=2;const bw=Math.min(16,(cw*0.8-(series.length-1)*gap)/series.length);
 let g='';for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#e2e8f0" ${i?'stroke-dasharray="3 4"':''}/><text x="${pl-6}" y="${y+4}" text-anchor="end">${Math.round(mx*i/4)}</text>`}
 labels.forEach((l,i)=>{const cx=pl+cw*i+cw/2;const tw=series.length*bw+(series.length-1)*gap;series.forEach((s,j)=>{const v=s.v[i],h=v/mx*ih,x=cx-tw/2+j*(bw+gap),y=pt+ih-h;
   g+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0,h)}" rx="3" fill="${s.c}"><title>${s.n}: ${v}</title></rect>`;if(v&&!sm)g+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" style="fill:#0f1b2d;font-weight:600;font-size:10px">${v}</text>`});
  g+=`<text x="${cx}" y="${H-7}" text-anchor="middle">${esc(l)}</text>`});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}

 if(m==='op')return [...ST_OP.map(s=>[s.k,s.t]),['PEND','Pendências (não encontrado, pintura, sem TAG/RFID)']];
 if(m==='mpt')return [['PENDENTE','Cadastro pendente'],['CONCLUIDO_C','Cadastro concluído'],['EM ESTOQUE','Em estoque'],['PARCIAL','Baixa parcial'],['BAIXADO','Baixado']];
 if(m==='rec')return [['AGUARD','Aguardando inspeção'],['INSP','Inspecionado'],['EM ESTOQUE','Em estoque'],['PARCIAL','Baixa parcial'],['BAIXADO','Baixado']];
 if(ENTR.includes(m))return [['EM ESTOQUE','Em estoque'],['PARCIAL','Baixa parcial'],['BAIXADO','Baixado']];
 if(m==='gdv')return ST_GDV.map(s=>[s.k,s.t]);
 if(m==='dev')return DEV_DEST.map(d=>[d,d==='OUTROS'?'Outros':d]);
 if(m==='emb')return EMBALAGENS.map(e=>[e,e]);

function filtered(m){
 const f=lf(m);const q=f.q.trim().toLowerCase();
 return regsOf(m).filter(r=>{
  const o=r.origem&&getReg(r.origem);
  if(f.gr&&grdKey(r)!==f.gr)return false;
  if(f.ct&&(r.contrato||(o&&o.contrato))!==f.ct)return false;
  if(f.pl&&(r.plataforma||(o&&o.plataforma))!==f.pl)return false;
  if(f.st==='PENDENTE'||f.st==='CONCLUIDO_C'){if(stMpt(r).k!==(f.st==='PENDENTE'?'PENDENTE':'CONCLUIDO'))return false}
  else if(f.st==='AGUARD'||f.st==='INSP'){if(inspPend(r)!==(f.st==='AGUARD'))return false}
  else if(f.st==='APL_AG'||f.st==='APL_OK'){if(!(f.st==='APL_AG'?aplPend(r):aplOk(r)))return false}
  else if(f.st){const k=stInfo(r).k;if(f.st==='PEND'?!PEND.includes(k):k!==f.st)return false}
  if(q){const hay=[r.cod,...MOD[m].fields.map(fd=>fieldVal(r,fd)),stInfo(r).t,...(r.itens||[]).flatMap(i=>[i.desc,i.nm,i.nfBr,i.nfDev,i.rt,i.reserva]),...embLinhas(r).flatMap(l=>[l.op,l.nfBr,l.nfDev]),...r.anexos.map(a=>a.nome)].join(' ').toLowerCase();if(!hay.includes(q))return false}
  return true}).sort((a,b)=>(b.data||'').localeCompare(a.data||'')||(b.criadoEm||0)-(a.criadoEm||0));
}

async function loadFotos(r){const out=[];for(const p of r.fotos){const v=await getFoto(p);if(v)out.push(v)}return out}
function anexoHTML(a,i,rm,tk){const rmAct=typeof rm==='string'?rm:'rmAnexo';const tkA=tk?` data-tk="${esc(tk)}"`:'';const ext=(a.nome.split('.').pop()||'').slice(0,4).toUpperCase();const url=a.asset?(a.url||('/_blob/'+a.asset)):'';
 return `<div class="file"><div class="fi">${esc(ext||'DOC')}</div><div class="fn"><b title="${esc(a.nome)}">${esc(a.nome)}</b><small>${fmtSize(a.tam)}${a.novo?' · novo':''}</small></div>
 ${rm?`<button type="button" class="btn sm d" data-act="${rmAct}" data-i="${i}">${ic('trash',14)}</button>`:`<div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm p" data-act="verAnexo" data-i="${i}"${tkA}>${ic('mon',14)}Visualizar</button><button class="btn sm" data-act="dlAnexo" data-i="${i}"${tkA}>${ic('down',14)}<span class="hm2">Baixar</span></button></div>`}</div>`}

 }
 if(ENTR.includes(r.m)){const e=entryInfo(r);
  extra=`${r.m==='mpt'?`<div class="sec">Status do cadastro</div><div class="row">${chip(stMpt(r).t,stMpt(r).c)}${r.opCod?`<span class="muted" style="font-size:12.5px">Migrado de OPs em verificação (${esc(r.opCod)})</span>`:''}${isAdmin()?(stMpt(r).k==='PENDENTE'?`<button class="btn sm g" data-act="setStMpt" data-id="${r.id}" data-s="CONCLUIDO">${ic('check',14)}Marcar como concluído</button>`:`<button class="btn sm" data-act="setStMpt" data-id="${r.id}" data-s="PENDENTE">Voltar para pendente</button>`):''}</div>${stMpt(r).k==='PENDENTE'?'<div class="note w" style="margin-top:8px">Cadastro pendente: complete Nº do pedido, NF de venda, NF BR e valor (botão <b>Editar</b>) e marque como concluído.</div>':''}`:''}${r.m==='rec'?itensTable(r):''}<div class="sec">Estoque desta NF BR</div>
  <div class="sttiles" style="margin-bottom:10px"><div class="stt" style="background:#0f8a5f14;color:#0f8a5f"><span>ENTRADA (NF BR)</span><b style="font-size:17px">${brl(e.ent)||'R$ 0,00'}</b></div><div class="stt" style="background:#c2570c14;color:#c2570c"><span>BAIXADO</span><b style="font-size:17px">${brl(e.out)||'R$ 0,00'}</b></div><div class="stt" style="background:#14306b14;color:#14306b"><span>SALDO</span><b style="font-size:17px">${brl(e.saldo)||'R$ 0,00'}</b></div></div>
  ${e.sd.length?e.sd.sort((a,b)=>(a.data||'').localeCompare(b.data||'')).map(x=>{const s2=stInfo(x);return `<div class="hist" style="cursor:pointer" data-act="detail" data-id="${x.id}"><div class="hh"><div class="row" style="gap:8px">${chip(MOD[x.m].nome,s2.c)}<b>${esc(x.cod)}</b><b class="mono">− ${brl(valorSaiDe(x,r.id))||'R$ 0,00'}</b>${(x.qtd||x.qtdEnvio)?`<span class="muted">${fmtN(x.qtd||x.qtdEnvio)} un.</span>`:''}<span class="muted">${fmtD(x.data)}</span></div><span class="muted" style="font-size:12px">${esc(s2.t)}</span></div></div>`}).join(''):'<div class="muted">Nenhuma baixa. O material está em estoque.</div>'}
  <div class="faint" style="font-size:12px;margin-top:8px">Baixas são feitas pelos controles <b>Devolução</b>, <b>Embarque</b> e <b>Requisição de envio - Fábrica</b>, informando esta NF BR.</div>
  ${r.opId&&getReg(r.opId)?`<div class="faint" style="font-size:12px;margin-top:10px">Originado da verificação <a href="#" data-act="detail" data-id="${r.opId}">${esc(getReg(r.opId).cod)}</a></div>`:''}`;
 }
 if(r.m==='emb')extra=embTable(r);
 else if(SAID.includes(r.m)){const o=r.origem&&getReg(r.origem);
  extra=`<div class="sec">Baixa no estoque</div><div class="note">${o?`Baixa de <b>${brl(valorSai(r))||'R$ 0,00'}</b> na NF BR <a href="#" data-act="detail" data-id="${o.id}"><b>${esc(o.nfBr||'')}</b> (${esc(o.cod)} – ${esc(MOD[o.m].nome)})</a>. Saldo atual dessa NF: <b>${brl(entryInfo(o).saldo)||'R$ 0,00'}</b>${r.item&&o.itens?` · saldo do item: <b>${fmtN(itemSaldo(o,r.item))}</b>`:''}.`:`Baixa de <b>${brl(valorSai(r))||'R$ 0,00'}</b> no saldo geral do estoque (sem vínculo a um recebimento).`}</div>`;
 }
 if(r.m==='gdv')extra=gdvTable(r);
 if(r.m==='sdv')extra=sdvTable(r);
 const areas=M.fields.filter(fd=>fd.t==='area'&&r[fd.k]);
 openModal(`<div class="mh"><div><div class="muted" style="font-size:12px;font-weight:600">${esc(M.ctrl)} · ${esc(M.nome)}</div><h2>${esc(r.cod)}${r.m==='env'?' – '+esc(r.titulo||ENV_TIT):''}</h2><div class="row" style="margin-top:6px;gap:6px">${r.m==='mpt'?chip('Cadastro '+stMpt(r).t.toLowerCase(),stMpt(r).c):''}${stChip(r)}</div></div><button class="btn ghost sm" data-act="close">${ic('x')}</button></div>
 <div class="mb">
  <div style="display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap"><div class="dl" style="flex:1;min-width:260px">
   ${flds.map(fd=>F(fd.l,fieldVal(r,fd),fd.t==='wide'?'full':'')).join('')}
   ${areas.map(fd=>F(fd.l,r[fd.k],'full')).join('')}
   <div class="full faint" style="font-size:12px">Cadastrado por ${esc(r.criadoPor||'—')} em ${fmtDT(r.criadoEm)}${r.atualizadoPor?` · atualizado por ${esc(r.atualizadoPor)} em ${fmtDT(r.atualizadoEm)}`:''}</div></div>
   ${r.m==='rec'?`<div style="width:120px;text-align:center"><div id="qrBox" style="border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff">${qrSVG(qrText(r))}</div><div class="faint" style="font-size:11px;margin-top:4px">QR de identificação</div></div>`:''}</div>

  ${r.m==='rec'?(inspPend(r)?`<button class="btn" data-act="inspSt" data-id="${r.id}" data-k="INSPECIONADO" style="color:#0f8a5f;border-color:#0f8a5f">${ic('check',15)}Marcar como inspecionado</button>`:`<button class="btn" data-act="inspSt" data-id="${r.id}" data-k="AGUARDANDO INSPEÇÃO">Voltar p/ aguardando inspeção</button>`):''}
  ${r.m==='env'?(aplPend(r)?`<button class="btn" data-act="aplSt" data-id="${r.id}" data-k="MATERIAL APLICADO" style="color:#0f8a5f;border-color:#0f8a5f">${ic('check',15)}Marcar material aplicado</button>`:`<button class="btn" data-act="aplSt" data-id="${r.id}" data-k="AGUARDANDO APLICAÇÃO">Voltar p/ aguardando aplicação</button>`):''}
  ${r.m==='gdv'?(stGdv(r.status).k==='COLETADO'?`<button class="btn" data-act="gdvSt" data-id="${r.id}" data-k="AGUARDANDO COLETA">Voltar p/ aguardando coleta</button>`:`<button class="btn" data-act="gdvSt" data-id="${r.id}" data-k="COLETADO" style="color:#0f8a5f;border-color:#0f8a5f">${ic('check',15)}Marcar como coletado</button>`):''}
  ${r.m==='sdv'?`<button class="btn g" data-act="sdvXls" data-id="${r.id}">${ic('xls',15)}Solicitação em Excel</button>`:''}
  ${r.m==='gdv'?`<button class="btn g" data-act="gdvXls" data-id="${r.id}">${ic('xls',15)}GRD em Excel</button>`:''}
  <button class="btn" data-act="edit" data-id="${r.id}">${ic('edit',15)}Editar</button>
  <button class="btn n" data-act="pdf" data-id="${r.id}">${ic('down',15)}${r.m==='env'?'Gerar requisição (PDF)':'Relatório PDF'}</button>
 </div>`,'lg',{reg:r.id});
 S._det=r.id;
 if(r.m==='rec'&&!window.qrcode)loadLib('qr').then(()=>{const b=$('#qrBox');if(b)b.innerHTML=qrSVG(qrText(r))}).catch(()=>{});
 if(r.fotos.length)loadFotos(r).then(arr=>{const b=$('#detFotos');if(b)b.innerHTML=arr.length?arr.map((u,i)=>`<div class="ph1"><img src="${u}" data-act="zoom" data-i="${i}"></div>`).join(''):'<span class="muted">Fotos não encontradas.</span>';S._zoom=arr});
}
function grdPanel(){
 const G=grdGroups();if(!G.length)return '';const al=G.filter(g=>g.alerta),rd=G.filter(g=>g.ready);
 return `<div class="card pad grdp"><div class="ch"><h3>GRDs em verificação <small>${G.length} GRD(s) · ${regsOf('op').length} OP(s)</small></h3>
  ${isAdmin()&&rd.length?`<button class="btn n" data-act="migAll">${ic('mpt',16)}Migrar GRDs concluídas p/ OPs em MPT (${rd.length})</button>`:''}</div>
  ${al.length?`<div class="grdal">${ic('alert',18)}<div><b>${plural(al.length,'GRD','GRDs')} em verificação há mais de ${GRD_ALERTA_DIAS} dias</b> — ${al.reduce((s,g)=>s+g.pend.length,0)} OP(s) precisam ser tratadas: ${al.map(g=>`GRD ${esc(g.grd)} (${g.pend.length})`).join(', ')}.</div></div>`:''}
  <div class="grdg">${G.map(g=>{const c=g.alerta?'#c42b2b':g.ready?'#0f8a5f':'#0b5cad';const pc=Math.round(g.conf.length/g.ops.length*100);
   return `<div class="grdc" style="--c:${c}"><div class="row" style="justify-content:space-between;gap:6px"><b class="gt">GRD ${esc(g.grd)}</b>${chip(plural(g.ops.length,'OP','OPs'),'#14306b')}</div>
    <div class="row" style="gap:6px;margin-top:6px">${chip(g.ready?'Concluída – '+plural(g.dias,'dia','dias'):(g.dias===0?'Em verificação desde hoje':`Em verificação há ${plural(g.dias,'dia','dias')}`),c)}${g.alerta?chip('Alerta: tratar OPs','#c42b2b'):''}</div>
    <div class="gbar"><i style="width:${pc}%"></i></div><div class="muted" style="font-size:12px">${g.conf.length}/${g.ops.length} conferidas · desde ${fmtD(g.ini)}</div>
    <div class="gops">${g.ops.map(o=>{const s=stOp(o.status);return `<button class="gop" data-act="detail" data-id="${o.id}" title="${esc(s.t)}" style="--c:${s.c}">${esc(o.op||o.cod)}</button>`}).join('')}</div>
    ${g.alerta?`<div class="gpend">Pendentes: ${g.pend.map(o=>esc(o.op||o.cod)).join(', ')}</div>`:''}
    ${g.ready&&isAdmin()?`<button class="btn sm g" style="margin-top:8px;width:100%" data-act="migGrd" data-k="${esc(g.key)}">${ic('mpt',14)}Migrar para OPs em MPT</button>`:''}</div>`}).join('')}</div></div>`;
}
function embTable(r){const L=embLinhas(r);const tot=valorSai(r);
 return `<div class="sec">OPs / NF BR do embarque (${L.length})</div><div class="tw" style="border:1px solid var(--line)"><table class="tbl"><thead><tr><th>#</th><th>OP</th><th>NF BR</th><th>NF de devolução</th><th style="text-align:right">Valor NF dev.</th><th>Estoque</th></tr></thead><tbody>
 ${L.map((l,i)=>{const o=l.origem&&getReg(l.origem);const b=linhaBaixa(l);return `<tr><td class="mono">${i+1}</td><td>${esc(l.op||'—')}</td><td>${o?`<a href="#" data-act="detail" data-id="${o.id}"><b>${esc(o.nfBr||l.nfBr||'')}</b></a><div class="faint" style="font-size:11px">${esc(o.cod)} · ${esc(MOD[o.m].nome)}</div>`:esc(l.nfBr||'—')+(l.nfBr?'<div class="faint" style="font-size:11px">não recebida no app</div>':'')}</td><td>${esc(l.nfDev||'—')}</td><td class="mono" style="text-align:right">${l.valor?brl(l.valor):'—'}</td><td>${b?chip('Baixa '+brl(b),'#c2570c'):chip('Sem baixa','#64748b')}</td></tr>`}).join('')}
 </tbody></table></div><div class="note" style="margin-top:8px">${tot?`Este embarque baixou <b>${brl(tot)}</b> do saldo do estoque.`:'Este embarque <b>não baixou</b> o estoque.'} Só baixa a linha que tem <b>NF BR recebida</b> no app <b>e</b> <b>NF de devolução</b> com valor.</div>`}
function gdvTable(r){const L=r.itens||[];if(!L.length)return '';const td=(v,st='')=>`<td style="${st}">${esc(v===''||v==null?'—':v)}</td>`;
 return `<div class="sec">Itens da GRD (${L.length})</div><div class="tw" style="border:1px solid var(--line)"><table class="tbl"><thead><tr><th>Item</th><th>NF BR</th><th>NF Dev</th><th>NM</th><th>UN</th><th style="text-align:right">Qtd.</th><th>Descrição</th><th style="text-align:right">Valor total</th><th style="text-align:right">Peso (kg)</th><th>Reserva</th><th>RT</th></tr></thead><tbody>
 ${L.map((it,i)=>`<tr><td class="mono">${i+1}</td>${td(it.nfBr)}${td(it.nfDev)}${td(it.nm)}${td(it.un)}<td class="mono" style="text-align:right">${it.qtd===''?'—':fmtN(it.qtd)}</td><td style="font-weight:600;min-width:160px">${esc(it.desc)}</td><td class="mono" style="text-align:right">${brl(it.vtotal)||'—'}</td><td class="mono" style="text-align:right">${it.peso===''?'—':fmtN(it.peso)}</td>${td(it.reserva)}${td(it.rt)}</tr>`).join('')}
 <tr><td colspan="7" style="text-align:right;font-weight:700">Totais</td><td class="mono" style="text-align:right;font-weight:800;color:#0f8a5f">${brl(r.valorTotal)||'R$ 0,00'}</td><td class="mono" style="text-align:right;font-weight:800;color:var(--navy)">${fmtN(+r.pesoTotal||0)}</td><td colspan="2"></td></tr></tbody></table></div>`}
function itensTable(r){const L=r.itens||[];if(!L.length)return '';
 return `<div class="sec">Itens da NF BR (${L.length})</div><div class="tw" style="border:1px solid var(--line)"><table class="tbl"><thead><tr><th>#</th><th>Descrição</th><th>NM</th><th>UN</th><th style="text-align:right">Qtd.</th><th style="text-align:right">Saldo qtd.</th><th style="text-align:right">Valor unit.</th><th style="text-align:right">Total</th></tr></thead><tbody>
 ${L.map((it,i)=>`<tr><td class="mono">${i+1}</td><td style="font-weight:600">${esc(it.desc)}</td><td>${esc(it.nm||'—')}</td><td>${esc(it.un||'')}</td><td class="mono" style="text-align:right">${fmtN(it.qtd)}</td><td class="mono" style="text-align:right;font-weight:700;color:var(--navy)">${fmtN(itemSaldo(r,it.id))}</td><td class="mono" style="text-align:right">${brl(it.vunit)}</td><td class="mono" style="text-align:right;font-weight:600">${brl(it.vtotal)}</td></tr>`).join('')}
 <tr><td colspan="7" style="text-align:right;font-weight:700">Valor total da NF BR</td><td class="mono" style="text-align:right;font-weight:800;color:#0f8a5f">${brl(itensTotal(r))}</td></tr></tbody></table></div>`}
function qrText(r){
 return `${empresa().toUpperCase()} MPT\n${r.cod}\nNF BR: ${r.nfBr||'-'} | RT: ${r.rt||'-'}\nCONTRATO: ${r.contrato||'-'}\nID:${r.id}`;
}

/* relógio digital do Painel */
const DSEM=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'],DMES=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
function relogioHTML(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `<div class="t">${z(d.getHours())}<span class="c">:</span>${z(d.getMinutes())}<span class="s">${z(d.getSeconds())}</span></div><div class="d">${DSEM[d.getDay()]} · ${d.getDate()} ${DMES[d.getMonth()]} ${d.getFullYear()}</div>`}
setInterval(()=>{const e=document.getElementById('relg');if(e)e.innerHTML=relogioHTML()},1000);

/* ================= SELETOR DE ARQUIVOS (global, fora da tela que redesenha) ================= */
// o próprio campo de arquivo fica por cima do botão: o toque do usuário abre o seletor direto (sem clique programático)
const pickBtns=ctx=>`<label class="addph pk">${ic('camera',22)}Tirar foto<input type="file" accept="image/*" capture="environment" data-pick="cam" data-ctx="${ctx}"></label><label class="addph pk">${ic('img',22)}Galeria<input type="file" accept="image/*" multiple data-pick="gal" data-ctx="${ctx}"></label>`;
const PICK={};
function doPick(k,ctx){S.pickCtx=ctx;const el=$('#pk_'+k);if(!el)return;el.value='';el.click()}
async function onPicked(k,files,ctxArg){
 const ctx=ctxArg||S.pickCtx;if(!files.length||!PICK[ctx])return;
 if(k==='doc')return PICK[ctx].docs&&PICK[ctx].docs(files);
 if(k==='gal'){const bad=files.filter(f=>f.type&&!/^image\//.test(f.type));if(bad.length)toast('Escolha apenas imagens (JPG/PNG) para as fotos.','err');files=files.filter(f=>!f.type||/^image\//.test(f.type))}
 const arr=PICK[ctx].fotos();if(!arr)return;const MX=PICK[ctx].max||MAX_FOTOS;const room=MX-arr.length;const take=files.slice(0,Math.max(0,room));

function compressImg(file,max=1280,q=0.74){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
 img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;let out='';let mx=max,qq=q;
  for(let k=0;k<6;k++){const r=Math.min(1,mx/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*r);c.height=Math.round(h*r);const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',qq);if(out.length<230000)break;mx*=0.82;qq=Math.max(0.45,qq-0.07)}
  URL.revokeObjectURL(url);res(out)};img.onerror=()=>{URL.revokeObjectURL(url);if(/jpe?g|png/i.test(file.type)&&file.size<900000){const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(new Error('Imagem inválida'));fr.readAsDataURL(file)}else rej(new Error('Imagem inválida'))};img.src=url})}
const readB64=file=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=()=>rej(fr.error);fr.readAsDataURL(file)});

  text(t,x,y,o={}){const lines=Array.isArray(t)?t:String(t??'').split('\n');const lh=st.size*1.15/KMM;

/* impressão direta: renderiza as páginas do PDF e abre a janela de impressão do navegador */
async function imprimirPdf(bytes,[wmm,hmm]){
 toast('Preparando impressão…');
 let lib;try{lib=await loadPdfJs()}catch(e){return toast('Não foi possível preparar a impressão. Use o botão PDF.','err')}
 const pdf=await lib.getDocument({data:bytes.slice?bytes.slice():bytes,isEvalSupported:false,useSystemFonts:true}).promise;
 const dpi=wmm>150?200:300,imgs=[];
 for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:dpi/72});const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
  const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:cx,viewport:vp,canvas:c}).promise;imgs.push(c.toDataURL('image/png'))}
 document.getElementById('printArea')?.remove();document.getElementById('printCss')?.remove();
 const st=document.createElement('style');st.id='printCss';
 st.textContent=`#printArea{display:none}@media print{@page{size:${wmm}mm ${hmm}mm;margin:0}html,body{margin:0!important;padding:0!important;background:#fff!important;width:${wmm}mm}body>*:not(#printArea){display:none!important}#printArea{display:block!important}#printArea img{display:block;width:${wmm}mm;height:${hmm}mm;break-after:page;page-break-after:always}#printArea img:last-child{break-after:auto;page-break-after:auto}}`;
 const area=document.createElement('div');area.id='printArea';area.innerHTML=imgs.map(u=>`<img src="${u}" alt="">`).join('');
 document.head.appendChild(st);document.body.appendChild(area);
 await Promise.all([...area.querySelectorAll('img')].map(im=>im.decode?im.decode().catch(()=>{}):null));
 const limpar=()=>{area.remove();st.remove();window.removeEventListener('afterprint',limpar)};
 window.addEventListener('afterprint',limpar);setTimeout(()=>{if(document.body.contains(area))limpar()},120000);
 try{window.print()}catch(e){limpar();return toast('O navegador bloqueou a janela de impressão. Use o botão PDF.','err')}
 toast('Na janela de impressão, escolha a impressora e use “Tamanho real” (100%).');
}

/* ================= TAREFAS DIÁRIAS ================= */
const ST_TK=[{k:'AGUARDANDO',t:'Aguardando execução',c:'#b7791f'},{k:'ANDAMENTO',t:'Em andamento',c:'#0b5cad'},{k:'NAO_FINALIZADO',t:'Não finalizado',c:'#db2777'},{k:'CONCLUIDO',t:'Concluído',c:'#0f8a5f'},{k:'CANCELADO',t:'Cancelado',c:'#64748b'}];
const stTk=k=>ST_TK.find(s=>s.k===k)||ST_TK[0];
const PRIO=[{k:'BAIXA',t:'Baixa',c:'#64748b'},{k:'MEDIA',t:'Média',c:'#0b5cad'},{k:'ALTA',t:'Alta',c:'#c2570c'},{k:'URGENTE',t:'Urgente',c:'#c42b2b'}];
const prio=k=>PRIO.find(p=>p.k===k)||PRIO[1];
const dDiff=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const tkOpen=t=>t.status!=='CONCLUIDO'&&t.status!=='CANCELADO';
const plural=(n,s,p)=>n+' '+(n===1?s:p);
function prazoInfo(t){
 if(t.status==='CANCELADO')return {k:'CANCELADO',t:'Cancelada',c:'#64748b'};
 if(t.status==='CONCLUIDO'){const fim=t.concluidoEm?isoOf(new Date(t.concluidoEm)):today();const d=t.prazo?dDiff(t.prazo,fim):0;
  return d>0?{k:'CONCLUIDO',t:`Concluída com ${plural(d,'dia','dias')} de atraso`,c:'#0f8a5f'}:{k:'CONCLUIDO',t:'Concluída no prazo',c:'#0f8a5f'}}
 if(!t.prazo)return {k:'EMDIA',t:'Sem prazo',c:'#0f8a5f'};
 const d=dDiff(today(),t.prazo);
 if(d<0)return {k:'ATRASO',t:`Em atraso há ${plural(-d,'dia','dias')}`,c:'#c42b2b'};
 return {k:'EMDIA',t:d===0?'Em dia · vence hoje':`Em dia · ${d===1?'falta 1 dia':'faltam '+d+' dias'}`,c:'#0f8a5f'};
}
const tkChips=t=>{const s=stTk(t.status),p=prazoInfo(t);return chip(s.t,s.c)+(tkOpen(t)?' '+chip(p.t,p.c):'')};

 L.forEach(t=>{c[t.status]=(c[t.status]||0)+1;if(tkOpen(t)){const p=prazoInfo(t);c[p.k]++}});return c}
function tkActiveOn(t,day){const a=t.inicio||t.prazo||'',b=t.prazo||t.inicio||'';return a&&b&&day>=a&&day<=b}

 return L.filter(t=>{

function calHTML(L,f){

 let cells='';const hj=today();

  const due=L.filter(t=>t.prazo===iso),act=L.filter(t=>tkActiveOn(t,iso)&&tkOpen(t));

}

function renderTupAnexos(){const b=$('#tupAnexos');if(!b||!S.tup)return;b.innerHTML=S.tup.anexos.map((a,i)=>anexoHTML(a,i,'rmTupAnexo')).join('')+(S.tup.anexos.length<MAX_ANEXOS?`<div class="photos"><label class="addph pk">${ic('clip',22)}Arquivos<input type="file" multiple data-pick="doc" data-ctx="tup"></label><div class="muted" style="flex:1;min-width:160px;align-self:center;font-size:12.5px">PDF, Word, Excel ou imagem (máx. ${MAX_ANEXO_MB} MB cada).</div></div>`:'')}

/* ================= VISUALIZADOR DE ANEXOS (PDF, Word, Excel, imagem) ================= */
const PDFJS_V='6.2.108';
const PDFJS_URLS=[`https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_V}/legacy/build/`,`https://unpkg.com/pdfjs-dist@${PDFJS_V}/legacy/build/`];
let pdfjsP=null;
function loadPdfJs(){
 if(pdfjsP)return pdfjsP;
 pdfjsP=(async()=>{let last;for(const base of PDFJS_URLS){try{
   const lib=await import(base+'pdf.min.mjs');
   if(!globalThis.pdfjsWorker)globalThis.pdfjsWorker=await import(base+'pdf.worker.min.mjs'); // worker na própria página (sem Worker externo)
   return lib}catch(e){last=e}}
  pdfjsP=null;throw new Error('Não foi possível carregar o leitor de PDF. Verifique a internet.')})();
 return pdfjsP;
}
function anexoKind(a){const n=(a.nome||'').toLowerCase(),t=(a.tipo||'').toLowerCase();
 if(t.includes('pdf')||n.endsWith('.pdf'))return 'pdf';
 if(/^image\/(png|jpe?g|gif|webp|bmp)/.test(t)||/\.(png|jpe?g|gif|webp|bmp)$/.test(n))return 'img';
 if(n.endsWith('.docx')||t.includes('wordprocessingml'))return 'docx';
 if(n.endsWith('.doc')||t==='application/msword')return 'doc';
 if(/\.(xlsx|xlsm|xls|ods)$/.test(n)||t.includes('spreadsheet')||t.includes('ms-excel'))return 'xls';
 if(/\.(csv|txt|json|md)$/.test(n)||t.startsWith('text/'))return 'txt';
 return 'outro'}
async function baixarAnexo(a){try{toast('Preparando arquivo…');const b=await anexoBytes(a);await saveFile(a.nome,b)}catch(e){toast('Não foi possível baixar o anexo: '+(e.message||e),'err')}}
const abOf=u=>u.buffer.slice(u.byteOffset,u.byteOffset+u.byteLength);
async function verAnexo(a){
 const ov=document.createElement('div');ov.className='ov';ov.style.zIndex=72;
 ov.innerHTML=`<div class="md lg vw"><div class="mh"><div style="min-width:0"><h2 style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.nome)}</h2><div class="muted" style="font-size:12px" id="vwInfo">${fmtSize(a.tam)}</div></div><div class="row" style="flex-wrap:nowrap;gap:6px"><button class="btn sm" data-v="dl">${ic('down',14)}Baixar</button><button class="btn ghost sm" data-v="x">${ic('x')}</button></div></div><div class="mb vwb" id="vwBody"><div class="empty"><div class="spin"></div>Abrindo documento…</div></div></div>`;
 document.body.appendChild(ov);
 let closed=false;const urls=[];
 const close=()=>{closed=true;urls.forEach(u=>URL.revokeObjectURL(u));ov.remove()};
 ov.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(e.target===ov||(b&&b.dataset.v==='x'))close();else if(b&&b.dataset.v==='dl')baixarAnexo(a);else if(b&&b.dataset.v==='sh'){ov.querySelectorAll('[data-v=sh]').forEach(x=>x.classList.toggle('on',x===b));ov.querySelectorAll('.xsh').forEach((x,i)=>x.style.display=i===+b.dataset.i?'':'none')}});
 const body=ov.querySelector('#vwBody'),info=ov.querySelector('#vwInfo');
 const kind=anexoKind(a);
 const sorry=msg=>{body.innerHTML=`<div class="empty"><b>${msg}</b>Use o botão <b>Baixar</b> para abrir no aplicativo do celular ou do computador.</div>`};
 if(kind==='doc')return sorry('Arquivos .doc (Word antigo) não podem ser visualizados aqui.');
 if(kind==='outro')return sorry('Este tipo de arquivo não pode ser visualizado aqui.');
 try{
  const bytes=await anexoBytes(a);if(closed)return;
  if(kind==='img'){const u=URL.createObjectURL(new Blob([bytes],{type:a.tipo||'image/jpeg'}));urls.push(u);body.innerHTML=`<img src="${u}" style="max-width:100%;display:block;margin:auto;border-radius:8px">`;return}
  if(kind==='txt'){body.innerHTML=`<pre class="vwtxt">${esc(new TextDecoder().decode(bytes).slice(0,200000))}</pre>`;return}
  if(kind==='pdf'){
   const lib=await loadPdfJs();if(closed)return;
   const doc=await lib.getDocument({data:bytes.slice(),isEvalSupported:false,useSystemFonts:true}).promise;
   const n=doc.numPages;info.textContent=`${fmtSize(a.tam)} · ${n} página(s)`;body.innerHTML='';
   const W=Math.min(body.clientWidth||800,1000)-4;const dpr=Math.min(2,window.devicePixelRatio||1);
   for(let i=1;i<=Math.min(n,60)&&!closed;i++){const pg=await doc.getPage(i);const v0=pg.getViewport({scale:1});const sc=W/v0.width;const vp=pg.getViewport({scale:sc*dpr});
    const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);c.style.width=Math.floor(vp.width/dpr)+'px';c.className='vwpg';
    const lab=document.createElement('div');lab.className='vwpn';lab.textContent=`Página ${i} de ${n}`;body.appendChild(c);body.appendChild(lab);
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp,canvas:c}).promise}
   if(n>60)body.insertAdjacentHTML('beforeend','<div class="empty">Mostrando as 60 primeiras páginas. Baixe o arquivo para ver todas.</div>');
   return}
  if(kind==='docx'){await loadLib('mammoth');if(closed)return;const r=await window.mammoth.convertToHtml({arrayBuffer:abOf(bytes)});
   const tmp=document.createElement('div');tmp.innerHTML=r.value||'';tmp.querySelectorAll('script,iframe,object,embed').forEach(x=>x.remove());tmp.querySelectorAll('*').forEach(el=>[...el.attributes].forEach(at=>{if(/^on/i.test(at.name))el.removeAttribute(at.name)}));
   body.innerHTML=`<div class="vwdoc">${tmp.innerHTML||'<p class="muted">Documento sem texto.</p>'}</div>`;return}
  if(kind==='xls'){await loadLib('xlsx');if(closed)return;const wb=window.XLSX.read(bytes,{type:'array',cellDates:true});const names=wb.SheetNames;
   info.textContent=`${fmtSize(a.tam)} · ${names.length} aba(s)`;
   body.innerHTML=(names.length>1?`<div class="pill-tabs" style="margin-bottom:10px">${names.map((nm,i)=>`<button data-v="sh" data-i="${i}" class="${i?'':'on'}">${esc(nm)}</button>`).join('')}</div>`:'')+
    names.map((nm,i)=>{let h=window.XLSX.utils.sheet_to_html(wb.Sheets[nm],{header:'',footer:'',editable:false});const t=document.createElement('div');t.innerHTML=h;t.querySelectorAll('script').forEach(x=>x.remove());const tb=t.querySelector('table');return `<div class="xsh" style="${i?'display:none':''}">${tb?`<div class="vwxl">${tb.outerHTML}</div>`:'<div class="muted">Aba vazia.</div>'}</div>`}).join('');return}
 }catch(e){console.error(e);body.innerHTML=`<div class="empty"><b>Não foi possível abrir o documento.</b>${esc(e.message||String(e))}<br>Use o botão <b>Baixar</b>.</div>`}
}

/* ================= MINHAS TAREFAS DIÁRIAS (somente ADM) ================= */
const DPRIO=[{k:'ALTA',t:'Alta',c:'#c42b2b'},{k:'MEDIA',t:'Média',c:'#d97706'},{k:'BAIXA',t:'Baixa',c:'#0b5cad'}];
const dprio=k=>DPRIO.find(p=>p.k===k)||DPRIO[1];
function nowHM(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function diaAtrasada(t){if(t.status==='FEITA')return false;const h=today();if(!t.data)return false;if(t.data<h)return true;return t.data===h&&!!t.hora&&t.hora<nowHM()}
function diaAtrasoTxt(t){if(!diaAtrasada(t))return '';const d=Math.round((new Date(today()+'T12:00')-new Date(t.data+'T12:00'))/864e5);return d>0?`Atrasada há ${plural(d,'dia','dias')}`:'Atrasada (horário passou)'}
const diaSort=(a,b)=>(a.data||'').localeCompare(b.data||'')||(a.hora||'99:99').localeCompare(b.hora||'99:99')||DPRIO.findIndex(p=>p.k===a.prio)-DPRIO.findIndex(p=>p.k===b.prio);
function diaFiltradas(){const f=S.dia;return S.diar.filter(t=>{
  if(f.st==='PENDENTE'&&t.status==='FEITA')return false;if(f.st==='FEITA'&&t.status!=='FEITA')return false;if(f.st==='ATRASADA'&&!diaAtrasada(t))return false;
  if(f.dia&&t.data!==f.dia)return false;return true}).sort((a,b)=>(a.status==='FEITA')-(b.status==='FEITA')||(diaAtrasada(b)-diaAtrasada(a))||diaSort(a,b))}
function diaCal(){

function evdCod(){const y=String(new Date().getFullYear()).slice(2);const pre='EVD-'+y+'-';let mx=0;S.evds.forEach(e=>{if(e.cod&&e.cod.startsWith(pre)){const n=parseInt(e.cod.slice(pre.length),10);if(n>mx)mx=n}});return pre+String(mx+1).padStart(4,'0')}

 return S.evds.filter(e=>(!f.cat||e.categoria===f.cat)&&(!f.de||(e.data||'')>=f.de)&&(!f.ate||(e.data||'')<=f.ate)&&(!q.length||(()=>{const h=semAc([e.cod,e.titulo,e.local,e.categoria,e.descricao,(e.legs||[]).join(' '),e.criadoPor].join(' '));return q.every(w=>h.includes(w))})()))
  .sort((a,b)=>(b.data||'').localeCompare(a.data||'')||(b.criadoEm||0)-(a.criadoEm||0))}

 const d={titulo:f.titulo.value.trim(),data:f.data.value||today(),local:f.local.value.trim(),categoria:f.categoria.value.trim(),descricao:f.descricao.value.trim()};

/* ================= DASHBOARD MPT (gráficos dinâmicos) ================= */
const DSH=[ // cor validada (paleta categórica, ordem fixa)
 {m:'rec',t:'Recebimento de materiais BR',s:'Rec. materiais BR',c:'#2f5bb7',ic:'rec',val:r=>valorEnt(r),vl:'Valor das NF BR'},
 {m:'fab',t:'Recebimento de Fabricados',s:'Fabricados',c:'#0f8a5f',ic:'fab',val:r=>valorEnt(r),vl:'Valor das NF BR'},
 {m:'mpt',t:'OPs em MPT',s:'OPs em MPT',c:'#0b9bd6',ic:'mpt',val:r=>valorEnt(r),vl:'Valor das NF BR'},
 {m:'dev',t:'Transferências (devoluções)',s:'Transferências',c:'#c27a00',ic:'dev',val:r=>valorSai(r),vl:'Valor das NF de devolução'},
 {m:'rcs',t:'Notas recusadas',s:'Recusas',c:'#c42b2b',ic:'rcs',val:()=>0,vl:''},
 {m:'emb',t:'Embarques',s:'Embarques',c:'#7c3aed',ic:'ship',val:r=>valorSai(r),vl:'Baixado do estoque'}];
const dshOrig=r=>r.origem?getReg(r.origem):(r.m==='emb'?getReg((embLinhas(r).find(l=>l.origem)||{}).origem):null);
const dshPlat=r=>r.plataforma||(dshOrig(r)||{}).plataforma||'';
function dshCtr(r){if(r.contrato)return r.contrato;const o=dshOrig(r);if(o&&o.contrato)return o.contrato;const p=dshPlat(r);if(p){const cs=ctrDoPlat(p);if(cs.length===1)return cs[0]}return ''}
function dshRange(){const f=S.dsh,t=new Date();let de='',ate=today();
 if(f.p==='30')de=isoOf(new Date(t.getFullYear(),t.getMonth(),t.getDate()-29));else if(f.p==='90')de=isoOf(new Date(t.getFullYear(),t.getMonth(),t.getDate()-89));
 else if(f.p==='ano')de=t.getFullYear()+'-01-01';else if(f.p==='12m')de=isoOf(new Date(t.getFullYear(),t.getMonth()-11,1));
 else if(f.p==='custom'){de=f.de||'';ate=f.ate||today()}
 else {const ds=S.regs.filter(r=>DSH.some(d=>d.m===r.m)&&r.data).map(r=>r.data).sort();de=ds[0]||isoOf(new Date(t.getFullYear(),t.getMonth()-11,1))}

const rkN=v=>String(v??'').toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/^0+(?=\d)/,'');
function rastroChaves(r){const k=[];const add=(t,v)=>{if(v!=null&&String(v).trim())k.push([t,String(v).trim()])};
 add('OP',r.op);add('GRD',r.grd);add('GRD transf.',r.grdTransf);add('NF BR',r.nfBr);add('NF devolução',r.nfDev);add('NF',r.nf);add('NF venda',r.nfVenda);add('Código',r.cod);add('Pedido',r.pedido);add('RT',r.rt);add('RT/FWO',r.rtFwo);add('Romaneio',r.romaneio);
 (r.itens||[]).forEach(i=>{add('NF BR',i.nfBr);add('NF devolução',i.nfDev);add('NF',i.nf);add('RT',i.rt);add('RT/FWO',i.rtFwo)});
 if(r.m==='emb')embLinhas(r).forEach(l=>{add('OP',l.op);add('NF BR',l.nfBr);add('NF devolução',l.nfDev);const lo=l.origem&&getReg(l.origem);if(lo)add('NF BR',lo.nfBr)});
 const o=r.origem&&getReg(r.origem);if(o){add('NF BR',o.nfBr);add('OP',o.op)}
 return k}
function rastroBusca(q){const n=rkN(q);if(n.length<2)return {exato:[],L:[]};
 const hit=r=>{const ks=rastroChaves(r);const ex=ks.filter(([t,v])=>rkN(v)===n);if(ex.length)return {r,por:ex,ex:1};const par=n.length>=4?ks.filter(([t,v])=>rkN(v).includes(n)):[];return par.length?{r,por:par,ex:0}:null};
 let L=S.regs.map(hit).filter(Boolean);const exato=L.filter(x=>x.ex);if(exato.length)L=exato;
 // inclui os lançamentos vinculados (ex.: devolução/envio ligados a um recebimento encontrado)
 const ids=new Set(L.map(x=>x.r.id));S.regs.forEach(r=>{if(!ids.has(r.id)&&r.origem&&ids.has(r.origem)){L.push({r,por:[['Vinculado a',getReg(r.origem).cod]],ex:1});ids.add(r.id)}});
 L.sort((a,b)=>(a.r.data||'').localeCompare(b.r.data||'')||(a.r.criadoEm||0)-(b.r.criadoEm||0));
 const T=(isAdmin()?S.tasks:myTasks()).filter(t=>[t.titulo,t.descricao,t.obs,...(t.upd||[]).map(u=>u.obs)].some(x=>rkN(x).includes(n)));
 return {L,T,ex:exato.length>0}}

/* ================= QR ================= */
async function onQRFile(file){
 if(!file)return;toast('Lendo QR code…');
 try{await loadLib('jsqr')}catch(e){return toast(e.message,'err')}
 const url=URL.createObjectURL(file);const img=new Image();
 img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,1400/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d');cx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
  const res=window.jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'attemptBoth'});
  if(!res||!res.data)return toast('QR code não encontrado na imagem. Tente uma foto mais próxima.','err');
  const t=res.data;const mi=t.match(/ID:([\w-]+)/);const mc=t.match(/((?:VER|MPT|REC|FAB|RCS|DEV|EMB|REQ)-\d{2}-\d{4})/);
  let r=mi&&getReg(mi[1]);if(!r&&mc)r=S.regs.find(x=>x.cod===mc[1]);
  if(r){go(r.m);openDetail(r.id)}else toast('Registro não encontrado para este QR.','err')};
 img.onerror=()=>toast('Imagem inválida.','err');img.src=url;
}

 const b=f.querySelector('.btn.p');b.disabled=true;b.textContent='Cadastrando…';
 try{const sec=firebase.apps.find(a=>a.name==='cad')||firebase.initializeApp(window.FB_CONFIG,'cad');const cr=await sec.auth().createUserWithEmailAndPassword(email,f.senha.value);const uid=cr.user.uid;await sec.auth().signOut();
  await retry(()=>S.db.doc('usuarios/'+uid).set({nome:f.nome.value.trim(),email,usuario:normUser(f.usuario.value)||email.split('@')[0],perfil:'usuario',ativo:true,perms:[],criadoEm:Date.now(),criadoPor:S.user.nome}));
  closeModal();toast('Usuário cadastrado: '+email)}catch(e){b.disabled=false;b.textContent='Cadastrar';toast(fbMsg(e),'err')}};
function pwModal(uid,self){const u=S.users.find(x=>x.id===uid);if(!u)return;
 if(!self){confirmBox(`Enviar para ${u.email} um e-mail com o link para criar uma nova senha?`,'Enviar').then(ok=>{if(ok)S.auth.sendPasswordResetEmail(u.email).then(()=>toast('E-mail de nova senha enviado para '+u.email)).catch(e=>toast(fbMsg(e),'err'))});return}
 openModal(`<form data-form="pw"><div class="mh"><h2>Alterar minha senha</h2><button type="button" class="btn ghost sm" data-act="close">${ic('x')}</button></div>
 <div class="mb grid"><div class="f"><label>Senha atual</label><input class="in" type="password" name="atual" required autocomplete="current-password"></div>
 <div class="grid g2"><div class="f"><label>Nova senha</label><input class="in" type="password" name="senha" minlength="6" required autocomplete="new-password"></div><div class="f"><label>Confirmar</label><input class="in" type="password" name="senha2" minlength="6" required autocomplete="new-password"></div></div></div>
 <div class="mf"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn p" type="submit">Salvar</button></div></form>`,'',{form:1})}
FORMS.pw=async f=>{if(f.senha.value!==f.senha2.value)return toast('As senhas não conferem.','err');const cu=S.auth.currentUser;
 try{await cu.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(cu.email,f.atual.value));await cu.updatePassword(f.senha.value);closeModal();toast('Senha atualizada.')}catch(e){toast(fbMsg(e),'err')}};
ACT.fbEsqueci=async()=>{const em=($('#loginBox [name=email]')||{}).value||'';if(!em.trim())return toast('Digite seu e-mail no campo acima e toque de novo em "Esqueci minha senha".','err');
 try{await S.auth.sendPasswordResetEmail(em.trim());toast('Se o e-mail estiver cadastrado, você receberá um link para criar nova senha.')}catch(e){toast(fbMsg(e),'err')}};
ACT.delUser=async b=>{const u=S.users.find(x=>x.id===b.dataset.u);if(!u||!isAdmin()||u.id===S.user.id)return;
 if(!(await confirmBox(`Remover o acesso de ${u.nome} (${u.email})? Os registros feitos por ele são mantidos.`,'Remover',1)))return;
 try{await retry(()=>S.db.doc('usuarios/'+u.id).delete());toast('Acesso removido. (O login continua existindo no Firebase, mas não abre mais o app. Para apagar de vez: Firebase › Authentication.)')}catch(e){wErr(e)}};
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

init();
</script>
